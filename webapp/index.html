<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог Материалов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --btn-color: var(--tg-theme-button-color, #2481cc);
            --btn-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
            
            --border-radius: 16px;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px; /* Space for fab */
        }

        /* Header / Categories */
        .header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.85); /* fallback */
            background: color-mix(in srgb, var(--bg-color) 85%, transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            padding: 12px 16px;
            border-bottom: 1px solid var(--secondary-bg);
        }
        
        .header h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .category-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        
        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            padding: 8px 16px;
            background: var(--secondary-bg);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-tab.active {
            background: var(--btn-color);
            color: var(--btn-text-color);
        }

        /* Catalog Grid */
        .catalog-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .category-section h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Product Card */
        .product-card {
            background: var(--secondary-bg);
            border-radius: var(--border-radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            object-fit: cover;
            background-color: #e0e0e0;
        }
        
        .product-image-placeholder {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--hint-color);
            font-size: 24px;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
        }

        .product-meta {
            font-size: 12px;
            color: var(--hint-color);
        }

        .status-badge {
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 600;
            width: fit-content;
        }
        
        .status-badge.unavailable {
            background: #ffebee;
            color: #c62828;
        }

        /* Actions */
        .action-area {
            margin-top: auto;
            min-height: 36px;
        }

        .btn-add {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: var(--btn-color);
            color: var(--btn-text-color);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        
        .btn-add:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn-add:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--hint-color);
        }

        .qty-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 4px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            background: var(--secondary-bg);
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        
        .qty-btn:active {
            background: var(--hint-color);
        }

        .qty-input {
            width: 40px;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 14px;
            color: var(--text-color);
            font-weight: 600;
        }
        
        .qty-input:focus {
            outline: none;
        }

        /* FAB Cart */
        .fab-cart {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: var(--btn-color);
            color: var(--btn-text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .fab-cart:active {
            transform: scale(0.9);
        }
        
        .fab-cart.hidden {
            transform: scale(0);
        }

        .cart-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ff3b30;
            color: white;
            font-size: 12px;
            font-weight: bold;
            min-width: 22px;
            height: 22px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            border: 2px solid var(--bg-color);
        }

        /* Cart Modal */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cart-modal.open {
            transform: translateY(0);
        }

        .cart-header {
            padding: 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--secondary-bg);
            background: var(--bg-color);
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--link-color);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .cart-title {
            flex-grow: 1;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            margin-right: 40px;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 32px;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--secondary-bg);
        }
        
        .cart-item-img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--secondary-bg);
        }

        .cart-item-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cart-item-name {
            font-weight: 600;
            font-size: 15px;
        }

        .cart-item-unit {
            font-size: 13px;
            color: var(--hint-color);
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        .btn-remove {
            color: #ff3b30;
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 8px;
        }
        
        .empty-cart-msg {
            text-align: center;
            color: var(--hint-color);
            margin-top: 60px;
            font-size: 16px;
        }

        /* Loaders */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--secondary-bg);
            border-top: 4px solid var(--btn-color);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loader" class="loader-container">
        <div class="spinner"></div>
    </div>

    <div class="header">
        <h1>Каталог</h1>
        <div class="category-tabs" id="categoryTabs">
            <!-- Tabs injected here -->
        </div>
    </div>

    <div class="catalog-container" id="catalogContainer">
        <!-- Catalog injected here -->
    </div>

    <div class="fab-cart hidden" id="fabCart" onclick="openCart()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <div class="cart-badge" id="cartBadge">0</div>
    </div>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <button class="btn-close" onclick="closeCart()">Закрыть</button>
            <div class="cart-title">Корзина</div>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <!-- Items injected here -->
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // --- CONSTANTS ---
        // Так как фронтенд теперь раздается самим FastAPI, мы используем относительные пути!
        const API_BASE_URL = ''; 
        // -----------------

        let catalog = [];
        let categories = [];
        let cart = {}; // { itemId: quantity }
        let cartExtra = {}; // { itemId: extraInfo }
        let currentCategory = 'Все';

        // Init Telegram App
        tg.ready();
        tg.expand();

        tg.MainButton.setText('Отправить выбор');
        tg.MainButton.onClick(submitCart);

        async function init() {
            try {
                // Если разрабатываете локально, можно заменить API_BASE_URL на 'http://localhost:8000'
                const response = await fetch(`${API_BASE_URL}/catalog`);
                if (!response.ok) throw new Error('Network response was not ok');
                catalog = await response.json();
                
                extractCategories();
                renderTabs();
                renderCatalog();
            } catch (error) {
                console.error('Catalog fetch error:', error);
                tg.showAlert('Ошибка загрузки каталога. Убедитесь, что бэкенд запущен.');
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function extractCategories() {
            const cats = new Set(catalog.map(item => item.category));
            categories = ['Все', ...Array.from(cats)];
            currentCategory = 'Все';
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';
            
            categories.forEach(cat => {
                const tab = document.createElement('div');
                tab.className = `category-tab ${cat === currentCategory ? 'active' : ''}`;
                tab.textContent = cat;
                tab.onclick = () => {
                    tg.HapticFeedback.impactOccurred('light');
                    currentCategory = cat;
                    renderTabs();
                    renderCatalog();
                };
                tabsContainer.appendChild(tab);
            });
        }

        function renderCatalog() {
            const container = document.getElementById('catalogContainer');
            container.innerHTML = '';

            let itemsToRender = catalog;
            if (currentCategory !== 'Все') {
                itemsToRender = catalog.filter(i => i.category === currentCategory);
            }

            if (currentCategory === 'Все') {
                const grouped = {};
                itemsToRender.forEach(i => {
                    if (!grouped[i.category]) grouped[i.category] = [];
                    grouped[i.category].push(i);
                });

                for (const [cat, items] of Object.entries(grouped)) {
                    const section = document.createElement('div');
                    section.className = 'category-section';
                    
                    const title = document.createElement('h2');
                    title.textContent = cat;
                    section.appendChild(title);
                    
                    const grid = document.createElement('div');
                    grid.className = 'products-grid';
                    grid.innerHTML = items.map(createProductCard).join('');
                    section.appendChild(grid);
                    
                    container.appendChild(section);
                }
            } else {
                const grid = document.createElement('div');
                grid.className = 'products-grid';
                grid.innerHTML = itemsToRender.map(createProductCard).join('');
                container.appendChild(grid);
            }
        }

        function createProductCard(item) {
            const inStock = item.status.toLowerCase().includes('в наличии');
            const badgeClass = inStock ? 'status-badge' : 'status-badge unavailable';
            
            const imageHtml = item.image_url 
                ? `<img src="${item.image_url}" alt="${item.name}" class="product-image">`
                : `<div class="product-image-placeholder">📷</div>`;

            const qty = cart[item.id] || 0;
            
            let actionHtml = '';
            if (!inStock) {
                actionHtml = `<button class="btn-add" disabled>Нет в наличии</button>`;
            } else if (qty > 0) {
                actionHtml = `
                    <div class="qty-control">
                        <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
                        <input type="number" class="qty-input" value="${qty}" onchange="setQty('${item.id}', this.value)" inputmode="decimal">
                        <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
                    </div>
                `;
            } else {
                actionHtml = `<button class="btn-add" onclick="updateQty('${item.id}', 1)">Добавить</button>`;
            }

            return `
                <div class="product-card" id="card-${item.id}">
                    ${imageHtml}
                    <div class="product-info">
                        <div class="${badgeClass}">${item.status}</div>
                        <div class="product-name">${item.name}</div>
                        <div class="product-meta">Ед. изм: ${item.unit}</div>
                    </div>
                    <div class="action-area" id="action-${item.id}">
                        ${actionHtml}
                    </div>
                </div>
            `;
        }

        function triggerHaptic() {
            tg.HapticFeedback.impactOccurred('light');
        }

        function updateQty(itemId, delta) {
            triggerHaptic();
            const current = cart[itemId] || 0;
            const newVal = Math.max(0, current + delta);
            
            if (newVal === 1 && current === 0) {
                const item = catalog.find(i => i.id === itemId);
                if (item) {
                    const catLower = item.category.toLowerCase();
                    if (catLower.includes('двер') || item.category === 'Двери') {
                        tg.showPopup({
                            title: 'Опции',
                            message: 'Выберите вариант:',
                            buttons: [
                                {id: 'без стекла', type: 'default', text: 'Без стекла'},
                                {id: 'со стеклом', type: 'default', text: 'Со стеклом'}
                            ]
                        }, function(btnId) {
                            if (btnId) {
                                cartExtra[itemId] = btnId;
                                finishUpdateQty(itemId, newVal);
                            }
                        });
                        return;
                    } else if (catLower.includes('смесител') || item.category === 'Смеситель') {
                        tg.showPopup({
                            title: 'Цвет',
                            message: 'Выберите цвет:',
                            buttons: [
                                {id: 'черный', type: 'default', text: 'Черный'},
                                {id: 'хром', type: 'default', text: 'Хром'}
                            ]
                        }, function(btnId) {
                            if (btnId) {
                                cartExtra[itemId] = btnId;
                                finishUpdateQty(itemId, newVal);
                            }
                        });
                        return;
                    }
                }
            }
            finishUpdateQty(itemId, newVal);
        }

        function finishUpdateQty(itemId, newVal) {
            if (newVal === 0) {
                delete cart[itemId];
                delete cartExtra[itemId];
            } else {
                cart[itemId] = newVal;
            }
            updateUIAfterCartChange(itemId);
        }

        function setQty(itemId, val) {
            const num = parseFloat(val);
            if (isNaN(num) || num <= 0) {
                delete cart[itemId];
                delete cartExtra[itemId];
            } else {
                cart[itemId] = num;
            }
            updateUIAfterCartChange(itemId);
        }
        
        function removeFromCart(itemId) {
            triggerHaptic();
            delete cart[itemId];
            delete cartExtra[itemId];
            updateUIAfterCartChange(itemId);
            renderCartModal();
        }

        function updateUIAfterCartChange(itemId) {
            const actionArea = document.getElementById(`action-${itemId}`);
            if (actionArea) {
                const item = catalog.find(i => i.id === itemId);
                if (item) {
                    const qty = cart[itemId] || 0;
                    if (qty > 0) {
                        actionArea.innerHTML = `
                            <div class="qty-control">
                                <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
                                <input type="number" class="qty-input" value="${qty}" onchange="setQty('${item.id}', this.value)" inputmode="decimal">
                                <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
                            </div>
                        `;
                    } else {
                        actionArea.innerHTML = `<button class="btn-add" onclick="updateQty('${item.id}', 1)">Добавить</button>`;
                    }
                }
            }
            updateCartBadge();
        }

        function updateCartBadge() {
            const count = Object.keys(cart).length;
            const fab = document.getElementById('fabCart');
            const badge = document.getElementById('cartBadge');
            
            badge.textContent = count;
            
            if (count > 0) {
                fab.classList.remove('hidden');
            } else {
                fab.classList.add('hidden');
                closeCart();
            }
        }

        function openCart() {
            triggerHaptic();
            renderCartModal();
            document.getElementById('cartModal').classList.add('open');
            tg.MainButton.show();
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('open');
            tg.MainButton.hide();
        }

        function renderCartModal() {
            const container = document.getElementById('cartItemsContainer');
            const items = Object.entries(cart);
            
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-cart-msg">Корзина пуста</div>';
                tg.MainButton.hide();
                return;
            }

            let html = '';
            items.forEach(([id, qty]) => {
                const item = catalog.find(i => i.id === id);
                if (!item) return;
                
                const img = item.image_url 
                    ? `<img src="${item.image_url}" class="cart-item-img">`
                    : `<div class="cart-item-img" style="display:flex;align-items:center;justify-content:center;font-size:20px;color:#999;">📷</div>`;

                html += `
                    <div class="cart-item">
                        ${img}
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-unit">Ед: ${item.unit}${cartExtra[id] ? ' (' + cartExtra[id] + ')' : ''}</div>
                            <div class="cart-item-actions">
                                <div class="qty-control" style="width: 120px;">
                                    <button class="qty-btn" onclick="updateQty('${id}', -1); renderCartModal();">-</button>
                                    <input type="number" class="qty-input" value="${qty}" onchange="setQty('${id}', this.value); renderCartModal();" inputmode="decimal">
                                    <button class="qty-btn" onclick="updateQty('${id}', 1); renderCartModal();">+</button>
                                </div>
                                <button class="btn-remove" onclick="removeFromCart('${id}')">Удалить</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        async function submitCart() {
            const initData = tg.initData;
            
            if (!initData) {
                tg.showAlert("Ошибка: недоступны данные авторизации. Запустите WebApp через Telegram.");
                return;
            }
            
            const payload = {
                initData: initData,
                items: Object.entries(cart).map(([item_id, quantity]) => ({
                    item_id,
                    quantity: parseFloat(quantity),
                    extra_info: cartExtra[item_id] || ""
                }))
            };

            tg.MainButton.showProgress();
            
            try {
                const response = await fetch(`${API_BASE_URL}/submit-cart`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert("Ваш выбор успешно отправлен сотрудникам!", () => {
                        cart = {};
                        closeCart();
                        renderCatalog();
                        updateCartBadge();
                        tg.close(); // закрыть миниапп
                    });
                } else {
                    throw new Error(data.detail || 'Неизвестная ошибка на сервере');
                }
            } catch (error) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert(`Ошибка при отправке: ${error.message}`);
            } finally {
                tg.MainButton.hideProgress();
            }
        }

        // Запуск
        init();
    </script>
</body>
</html>
